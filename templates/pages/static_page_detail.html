{% extends "base.html" %}

{% block content %}
<div class="blog-detail-page static-page">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-8">

        <div class="blog-content">
          <h1>{{ page.title }}</h1>

          {% if page.updated_at %}
            <p class="blog-date">
              {{ page.updated_at|date:"F d, Y" }}
            </p>
          {% endif %}

          {{ page.content|safe }}
        </div>

      </div>
    </div>
  </div>
</div>
{% endblock %}
